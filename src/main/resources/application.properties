spring.application.name=pod-portal
server.port=8080

# H2 file database (development / test). Data is kept in ./data
spring.datasource.url=jdbc:h2:file:./data/podportal
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Health endpoint used later by Jenkins and the Task 14 health check
management.endpoints.web.exposure.include=health,info
