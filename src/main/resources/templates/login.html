
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Proof of Delivery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8efff, #f8fafc);
            color: #172554;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 36px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 16px 48px rgba(30, 64, 175, 0.12);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            color: white;
            background: #2563eb;
            font-size: 25px;
            font-weight: bold;
        }

        .brand h1 {
            margin: 0 0 5px;
            font-size: 19px;
        }

        .brand p,
        .subtitle {
            margin: 0;
            color: #64748b;
            font-size: 13px;
        }

        h2 {
            margin-bottom: 8px;
            font-size: 27px;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 26px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            color: white;
            background: #2563eb;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .alert {
            padding: 12px;
            margin-top: 18px;
            border-radius: 8px;
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>
<div class="login-card">

    <div class="brand">
        <div class="brand-icon">✓</div>
        <div>
            <h1>Proof of Delivery</h1>
            <p>Delivery Management Portal</p>
        </div>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to access your workspace.</p>

    <div class="alert error" th:if="${loginError}">
        Invalid username or password. Please try again.
    </div>

    <div class="alert success" th:if="${loggedOut}">
        You have successfully signed out.
    </div>

    <form th:action="@{/login}" method="post">

        <label for="username">Username</label>
        <input id="username"
               name="username"
               type="text"
               autocomplete="username"
               placeholder="Enter your username"
               required
               autofocus>

        <label for="password">Password</label>
        <input id="password"
               name="password"
               type="password"
               autocomplete="current-password"
               placeholder="Enter your password"
               required>

        <button type="submit">Sign In</button>
    </form>

    <p class="footer">
        Secure access for Admin, Agent and Reviewer
    </p>

</div>
</body>
</html>
