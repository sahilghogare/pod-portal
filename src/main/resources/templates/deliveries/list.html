<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery List</title>
</head>
<body>

<h1>Delivery List</h1>

<a id="new-delivery-link"
   th:if="${canCreateDelivery}"
   href="/deliveries/new">
    Create New Delivery
</a>

<table border="1">
    <thead>
    <tr>
        <th>Tracking No</th>
        <th>Customer</th>
        <th>Address</th>
        <th>Item</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="delivery : ${deliveries}">
        <td th:text="${delivery.trackingNo}"></td>
        <td th:text="${delivery.customer}"></td>
        <td th:text="${delivery.address}"></td>
        <td th:text="${delivery.item}"></td>
        <td th:text="${delivery.status}"></td>
        <td>
            <a th:href="@{/deliveries/{id}(id=${delivery.id})}">
                View
            </a>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(deliveries)}">
        <td colspan="6">No deliveries found.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
