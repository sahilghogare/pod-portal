<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assign Deliveries</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f1f5f9; color: #1e293b; }
        h1 { color: #1d4ed8; }
        .notice { padding: 12px; margin: 12px 0; border-radius: 8px; }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 13px; border: 1px solid #e2e8f0; text-align: left; }
        th { background: #dbeafe; }
        button, .link { padding: 9px 13px; border: 0; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; text-decoration: none; }
        select { padding: 8px; margin-right: 5px; }
        .status { font-weight: bold; color: #1d4ed8; }
    </style>
</head>
<body>

<h1>Delivery Assignment</h1>
<p>Assign created deliveries to an agent.</p>
<p><a th:href="@{/admin/home}">Back to Admin Home</a></p>

<div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div>
<div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

<table>
    <thead>
    <tr>
        <th>Tracking Number</th>
        <th>Customer</th>
        <th>Item</th>
        <th>Status</th>
        <th>Assigned Agent</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="delivery : ${deliveries}">
        <td th:text="${delivery.trackingNo}"></td>
        <td th:text="${delivery.customer}"></td>
        <td th:text="${delivery.item}"></td>
        <td class="status" th:text="${delivery.status}"></td>
        <td th:text="${delivery.assignedAgent != null ? delivery.assignedAgent : 'Not assigned'}"></td>
        <td>
            <form th:if="${delivery.status.name() == 'CREATED'}"
                  th:action="@{/admin/deliveries/{id}/assign(id=${delivery.id})}"
                  method="post">
                <select name="agentUsername" required>
                    <option value="agent">agent</option>
                </select>
                <button type="submit">Assign</button>
            </form>
            <span th:if="${delivery.status.name() != 'CREATED'}">Already assigned or in progress</span>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(deliveries)}">
        <td colspan="6">No deliveries available.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
